version: "3.9"

services:
  frontend:
    build: ../frontend
    ports:
      - "3000:3000"

  backend:
    build: ../backend
    ports:
      - "8080:8080"

  ai-service:
    build: ../ai-service
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smartdesk
      POSTGRES_USER: smartdesk
      POSTGRES_PASSWORD: smartdesk123
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"